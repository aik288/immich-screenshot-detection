services:
    immich-screenshot-categorizer:
        build: .
        container_name: immich-screenshot-categorizer
        # This is a one-shot batch job, so it should not restart on success.
        restart: "no"
        env_file:
            - .env
        environment:
            # Override in .env if your Immich service has a different name/port.
            IMMICH_SERVER_URL: ${IMMICH_SERVER_URL:-http://immich-server:2283}
        volumes:
            - ./logs:/app/logs
        networks:
            - immich

networks:
    immich:
        external: true
        # Name of your existing Immich network, e.g. from Immich's compose file.
        name: ${IMMICH_NETWORK:-immich_default}
